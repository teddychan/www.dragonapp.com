# Refresh the "What's new" lists from each release's whats-new.json and open a PR.
#
# Why this exists: each app's release CI (teddychan/dragon-release-ci) publishes
# the GitHub Release, the Sparkle appcast and the Homebrew cask, but it never
# touches this repo's changelog data — so every release left the marketing pages
# advertising the previous version until someone re-ran the scripts by hand.
#
# It opens a PR rather than pushing to main on purpose. Merging is what publishes
# copy in seven languages to four marketing pages, and a release whose asset is
# missing or unreadable silently keeps the previous entry — both worth a human
# reading the diff.
name: Refresh changelogs

on:
  # Sent by an app's release workflow right after it publishes a release.
  repository_dispatch:
    types: [app-released]
  workflow_dispatch:
  # Backstop only: a dropped dispatch would silently reintroduce the drift this
  # workflow exists to prevent. Safe to delete if the dispatch proves reliable.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-changelogs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BRANCH: site/auto-changelog-refresh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Fetch release notes
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # fetch-changelogs.py keeps the previous file for any app whose API
          # call fails, and the previous entry for any release whose
          # whats-new.json will not download, so a partial refresh is possible —
          # surface that instead of letting a half-refresh look like a clean run.
          python3 scripts/fetch-changelogs.py | tee /tmp/fetch.log
          # Recorded as an output, not just an annotation: the auto-merge gate below
          # has to be able to refuse. A ::warning:: nobody reads was the whole of the
          # response to a partial refresh before, which is fine while a human reads
          # the diff and useless the moment one does not.
          if grep -q '\[warn\]' /tmp/fetch.log; then
            echo "::warning::at least one app or release kept what the site already had; see the log above"
            echo "warned=true" >> "$GITHUB_OUTPUT"
          else
            echo "warned=false" >> "$GITHUB_OUTPUT"
          fi

      # Runs BEFORE the build on purpose: test_build.py shells out to
      # build_i18n.py against the real docs/ tree, which rewrites the asset URLs
      # bare and so strips the ?v= fingerprints. Testing after cache-bust.sh
      # would commit unfingerprinted pages on every run.
      - name: Test
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest i18n/tests -q

      - name: Rebuild pages and re-stamp assets
        run: |
          set -euo pipefail
          # Nothing may touch docs/ after this step. build_i18n.py writes asset
          # URLs bare, so cache-bust.sh has to follow it or the fingerprints are
          # lost. The pair is convergent: unchanged assets re-stamp to the same
          # hash, so reruns are no-ops rather than churn.
          python3 i18n/build_i18n.py
          ./scripts/cache-bust.sh
          # Cheap invariant: this silently regressed site-wide once already, so
          # fail loudly rather than committing bare asset URLs again.
          stamped=$(grep -rl '?v=' docs/ --include='*.html' | wc -l | tr -d ' ')
          echo "pages carrying an asset fingerprint: $stamped"
          if [ "$stamped" -eq 0 ]; then
            echo "::error::cache-bust.sh stamped nothing — every page would ship bare asset URLs"
            exit 1
          fi

      - name: Summarise what changed
        id: summary
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Every page already matches the latest releases — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # "Spectacle 2 2.2.0; ClipMenu 2 2.19.0" — newest version of each app
          # whose changelog moved. Reads from repo files only; no event input.
          python3 - > /tmp/summary.txt <<'PY'
          import json, subprocess
          changed = subprocess.run(["git", "diff", "--name-only", "--", "i18n/changelogs"],
                                   capture_output=True, text=True).stdout.split()
          parts = []
          for path in changed:
              slug = path.rsplit("/", 1)[-1].removesuffix(".json")
              entries = json.load(open(path))
              name = json.load(open("i18n/apps/%s.json" % slug))["name"]
              if entries:
                  parts.append("%s %s" % (name, entries[0]["version"]))
          # No changelog delta means the run only regenerated pages or re-stamped
          # assets — say so rather than implying the notes moved.
          print("; ".join(parts) if parts else "regenerated pages")
          PY
          {
            echo "text<<EOF"
            cat /tmp/summary.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Is this diff purely a changelog refresh, or does it carry something a person
      # should read? Everything the steps above write lands in exactly two places —
      # i18n/changelogs/*.json (fetch) and docs/** (build + cache-bust) — so anything
      # outside those means the branch picked up a change this workflow did not make.
      #
      # ALL FOUR conditions are required. Each one is a way an unread diff could reach
      # main, and the fourth is the one that is easy to miss:
      #
      #   1. Only those two paths changed.
      #   2. The fetch logged no [warn]. A warn means at least one app silently kept
      #      what the site already had, so "the notes are current" is unproven.
      #   3. The trigger was a release dispatch. A scheduled catch-up means a dispatch
      #      was dropped — abnormal by definition, so it gets a human.
      #   4. At least one changelog file actually moved. A docs/**-only diff is a
      #      REGENERATION: main's pages had drifted from its own i18n/ sources, which
      #      happens when someone merges a template or strings change without running
      #      the build. Auto-merging that would publish an unrelated visual change
      #      nobody reviewed, under a title about release notes.
      - name: Classify the diff
        id: gate
        env:
          WARNED: ${{ steps.fetch.outputs.warned }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          verdict=true
          reason=""

          # Untracked files count too: a brand-new app's first changelog file arrives
          # untracked, and --porcelain lists it where `git diff --name-only` would not.
          #
          # A while-read loop and plain strings, not `mapfile` and arrays: those are
          # bash-4 features, so the logic could not be exercised on a bash-3.2 Mac
          # before shipping. This form runs anywhere, which is the only reason the
          # scenario table in the PR body could be produced at all.
          stray=""
          changelogs=0
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            case "$p" in
              docs/*) ;;
              i18n/changelogs/*.json) changelogs=$((changelogs + 1)) ;;
              *) stray="${stray}${p} " ;;
            esac
          done <<EOF
          $(git status --porcelain | sed 's/^...//')
          EOF

          if [ -n "$stray" ]; then
            verdict=false; reason="paths outside i18n/changelogs and docs/: ${stray% }"
          elif [ "$changelogs" -eq 0 ]; then
            verdict=false; reason="no changelog file moved — this is a page regeneration, not a refresh"
          elif [ "$WARNED" = "true" ]; then
            verdict=false; reason="the fetch logged [warn]; at least one app kept its previous notes"
          elif [ "$EVENT" != "repository_dispatch" ]; then
            verdict=false; reason="trigger was ${EVENT}, not a release dispatch"
          fi

          if [ "$verdict" = "true" ]; then
            echo "Mechanical: ${changelogs} changelog file(s) plus generated pages. Will auto-merge."
          else
            echo "::notice title=Needs review::${reason}"
          fi
          echo "mechanical=${verdict}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Open or update the refresh PR
        if: steps.summary.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.summary.outputs.text }}
        run: |
          set -euo pipefail
          git config user.name  'Dragon Site Bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -A
          git commit -q -m "site: refresh changelogs — ${SUMMARY}" -m \
            "Regenerated by .github/workflows/refresh-changelogs.yml: scripts/fetch-changelogs.py + i18n/build_i18n.py + scripts/cache-bust.sh."
          # Plain --force: this branch is owned solely by this workflow, which is
          # serialised by the concurrency group. --force-with-lease cannot work
          # here because the shallow checkout has no remote-tracking ref for it.
          git push -q --force origin "HEAD:refs/heads/${BRANCH}"

          # --state open matters. `gh pr view <branch>` matches CLOSED PRs too,
          # so once a refresh PR had been closed this branch kept "finding" it,
          # skipped creating a new one, and two real releases (Ice 2 2.11.0 and
          # KeyKey 2.9.0) sat refreshed-but-unreviewed on the branch while the
          # site stayed stale — a silent failure, since the run still went green.
          OPEN="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
          if [ "${OPEN:-0}" -gt 0 ]; then
            # Retitle, don't just re-push. The title is written once at creation, so a PR
            # updated by later dispatches used to keep announcing whichever app happened
            # to release first: #78 said "Spectacle 2 2.5.7" while carrying four apps'
            # notes. Harmless while a human opens the diff, actively misleading once the
            # gate below reads this same PR — and it is the field a reviewer skims.
            gh pr edit "$BRANCH" --title "site: refresh changelogs — ${SUMMARY}"
            echo "Updated the existing refresh PR and retitled it: ${SUMMARY}"
            exit 0
          fi

          # Quoted delimiter: the body is literal, so its backticks stay text.
          # $SUMMARY is appended separately rather than interpolated.
          cat > /tmp/body.md <<'BODY'
          Opened automatically after a release. **Read the notes before merging** — they are each release's `whats-new.json` asset, which is the app's own What's New pane, and merging publishes them in seven languages.

          To fix wording, fix the **app's What's New strings** and ship them with the next release rather than editing `i18n/changelogs/*.json` here. That file is generated, so the next fetch would overwrite a hand-edit — whereas the app's own pane is reproduced by every future fetch.

          A release with no `whats-new.json` keeps whatever entry the site already has, and gets none if it had none — so a version missing below means its release predates the asset, not that the fetch failed.

          Generated by `.github/workflows/refresh-changelogs.yml`:

          1. `scripts/fetch-changelogs.py` — updates `i18n/changelogs/*.json` from each release's `whats-new.json`
          2. `i18n/build_i18n.py` — regenerates `docs/` across all 7 locales
          3. `scripts/cache-bust.sh` — re-stamps the `?v=` asset fingerprints the build strips

          `python3 -m pytest i18n/tests` passed before this PR was opened.
          BODY
          printf '\nChanged: %s\n' "$SUMMARY" >> /tmp/body.md

          gh pr create --base main --head "$BRANCH" \
            --title "site: refresh changelogs — ${SUMMARY}" \
            --body-file /tmp/body.md

      # The point of the gate: a purely mechanical refresh publishes itself.
      #
      # Still through a PR rather than a push to main — the audit trail and the repo's
      # own branch-and-PR rule both survive. main requires a pull request with zero
      # approvals and no status checks, so GITHUB_TOKEN can merge its own; no PAT and
      # no branch-protection change are needed.
      #
      # Not `--auto`: this repo runs no workflow on pull_request, so there is nothing
      # to wait for. The tests that matter already ran in THIS job, before the build.
      #
      # `|| true` on the notice: a merge that races the concurrency group is not worth
      # failing an already-correct refresh over. The next run reopens the PR.
      - name: Auto-merge a mechanical refresh
        if: steps.summary.outputs.changed == 'true' && steps.gate.outputs.mechanical == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.summary.outputs.text }}
        run: |
          set -euo pipefail
          if gh pr merge "$BRANCH" --squash --delete-branch; then
            echo "Published: ${SUMMARY}"
          else
            echo "::warning::mechanical refresh could not be merged; it is open for review"
          fi

      - name: Say why a refresh is waiting
        if: steps.summary.outputs.changed == 'true' && steps.gate.outputs.mechanical != 'true'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          echo "::notice title=Refresh PR needs a human::${REASON}"
